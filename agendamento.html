<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento</title>
</head>

<body>
<html lang="pt-br">

<body bgcolor="lavender">

    <br>

    <hr>

    <font color="#1E4091" face="Georgia, serif" size="6">
        <h2 align="center">AGENDAMENTOS</h2>
    </font>

    <p align="center">
        Agende uma aula experimental e venha conhecer o Le Classic Pilates!
    </p>

    <br>

    <table align="center" cellpadding="10">

        <tr>
            <td>

                <form>

                    <p>
                        <b>Nome:</b><br>
                        <input type="text" name="nome" size="40">
                    </p>

                    <p>
                        <b>E-mail:</b><br>
                        <input type="email" name="email" size="40">
                    </p>

                    <p>
                        <b>Telefone:</b><br>
                        <input type="tel" name="telefone" size="40">
                    </p>

                    <p>
                        <b>Data:</b>
                        <br>
                        <input type="date" name="data">
                    </p>

                    <p>
                        <b>Horário:</b>
                        <br>
                        <input type="time" name="horario">
                    </p>

                    <p>
                        <b>Nível:</b><br>

                        <select name="nivel">
                            <option>Selecione</option>
                            <option>Iniciante</option>
                            <option>Intermediário</option>
                            <option>Avançado</option>
                        </select>
                    </p>

                    <p>
                        <b>Objetivo:</b><br>

                        <input type="radio" name="objetivo">
                        Condicionamento físico
                        <br>

                        <input type="radio" name="objetivo">
                        Flexibilidade
                        <br>

                        <input type="radio" name="objetivo">
                        Fortalecimento
                        <br>

                        <input type="radio" name="objetivo">
                        Alívio de dores
                    </p>

                    <p>
                        <b>Possui alguma observação?</b><br>

                        <textarea rows="5" cols="42"></textarea>
                    </p>

                    <br>

                    <p align="center">
                        <input type="submit" value="ENVIAR">

                        <input type="reset" value="CANCELAR">
                    </p>

                </form>

            </td>
        </tr>

    </table>

    <br>
    <hr>

    <p align="center">
        Le Classic Pilates - Todos os direitos reservados
    </p>

</body>

</html>
</body>
</html>
